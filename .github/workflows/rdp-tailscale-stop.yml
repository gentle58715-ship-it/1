name: Tailscale cleanup

on:
  workflow_dispatch:
    inputs:
      hostname_prefix:
        description: "Delete devices whose hostname starts with this prefix"
        required: false
        default: "gha-rdp-"
      dry_run:
        description: "List matches without deleting them"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      TS_TAILNET: ${{ secrets.TS_TAILNET }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}

    steps:
      - name: Remove matching Tailscale devices
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_TAILNET)) {
            throw "Missing repository secret: TS_TAILNET"
          }
          if ([string]::IsNullOrWhiteSpace($env:TS_API_KEY)) {
            throw "Missing repository secret: TS_API_KEY"
          }
          Write-Output "::add-mask::$env:TS_API_KEY"

          $authBytes = [Text.Encoding]::ASCII.GetBytes("$($env:TS_API_KEY):")
          $auth = [Convert]::ToBase64String($authBytes)
          $tailnet = [uri]::EscapeDataString($env:TS_TAILNET)
          $prefix = "${{ inputs.hostname_prefix }}"
          $dryRun = "${{ inputs.dry_run }}" -eq "true"
          $headers = @{ Authorization = "Basic $auth" }

          $response = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$tailnet/devices" -Headers $headers
          $targets = @($response.devices | Where-Object { $_.hostname -like "$prefix*" })

          if ($targets.Count -eq 0) {
            Write-Host "No matching devices."
            exit 0
          }

          $targets | ForEach-Object { Write-Host "Matched: $($_.hostname)" }
          if ($dryRun) {
            Write-Host "Dry run enabled; nothing was deleted."
            exit 0
          }

          foreach ($device in $targets) {
            Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($device.id)" -Headers $headers
            Write-Host "Deleted: $($device.hostname)"
          }
